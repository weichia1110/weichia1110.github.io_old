<!DOCTYPE html>
<html lang="zh-Hant" data-theme="purple">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<noscript><style>.enter{display:none}.locked .card{opacity:1!important}</style></noscript>
</head>
<body class="locked">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-github" viewBox="0 0 16 16"><path fill="currentColor" stroke="none" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></symbol>
  <symbol id="i-discord" viewBox="0 0 24 24"><path d="M7 7c3-1.3 7-1.3 10 0 1.8 2.7 2.6 5.6 2.4 8.5-1.5 1.2-3 1.9-4.4 2.3l-1-1.7c.5-.2 1-.4 1.4-.7M7 7C5.2 9.7 4.4 12.6 4.6 15.5c1.5 1.2 3 1.9 4.4 2.3l1-1.7c-.5-.2-1-.4-1.4-.7M10 16.1c1.3.5 2.7.5 4 0"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/></symbol>
  <symbol id="i-youtube" viewBox="0 0 24 24"><path d="M2.5 17a24.12 24.12 0 0 1 0-10 2 2 0 0 1 1.4-1.4 49.56 49.56 0 0 1 16.2 0A2 2 0 0 1 21.5 7a24.12 24.12 0 0 1 0 10 2 2 0 0 1-1.4 1.4 49.55 49.55 0 0 1-16.2 0A2 2 0 0 1 2.5 17"/><path d="m10 15 5-3-5-3z"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><polygon fill="currentColor" points="6 3 20 12 6 21 6 3"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect fill="currentColor" x="14" y="4" width="4" height="16" rx="1"/><rect fill="currentColor" x="6" y="4" width="4" height="16" rx="1"/></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></symbol>
</svg>

<div class="bg" aria-hidden="true"></div>
<div class="dim" aria-hidden="true"></div>

<button class="enter" id="enter" type="button">
  <b id="enterName"></b>
  <span>Click to Enter</span>
</button>

<main class="page" id="page">
  <div class="grid">

    <article class="card profile">
      <div class="top">
        <div class="avatar"><img id="avatar" alt="" width="132" height="132"></div>
        <div class="who">
          <h1 id="name"></h1>
          <p class="muted" id="user"></p>
          <div class="badges" id="badges"></div>
        </div>
      </div>
      <p class="bio" id="bio"><span class="ghost" id="bioGhost" aria-hidden="true"></span><span class="typed" aria-hidden="true"><span id="bioText"></span><i class="caret"></i></span></p>
      <p class="status"><span class="dot" id="statusDot"></span><span id="statusText"></span></p>
      <p class="muted small" id="joined"></p>
      <nav class="social" id="social" aria-label="Social links"></nav>
      <p class="muted small loc"><svg class="ic"><use href="#i-pin"/></svg><span id="loc"></span></p>
    </article>

    <article class="card music" id="music">
      <div class="row">
        <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <p class="track" id="track"></p>
        <button class="btn round" id="play" type="button" aria-label="Play"><svg class="ic"><use href="#i-play"/></svg></button>
      </div>
      <div class="row seek"><span class="small muted" id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek"><span class="small muted" id="dur">0:00</span></div>
      <div class="row"><button class="btn icon" id="mute" type="button" aria-label="Mute"><svg class="ic"><use href="#i-vol"/></svg></button><input type="range" id="vol" min="0" max="1" step="0.01" aria-label="Volume"></div>
    </article>

    <article class="card about"><h2>About me</h2><div id="about"></div></article>
    <article class="card skills"><h2>Skills</h2><div id="skills"></div></article>
    <article class="card projects"><h2>Projects</h2><div class="proj-grid" id="projects"></div></article>

  </div>
  <p class="foot muted small" id="foot"></p>
</main>

<button class="fab" id="fab" type="button" aria-label="Open settings" aria-expanded="false" aria-controls="panel"><svg class="ic"><use href="#i-gear"/></svg></button>
<div class="scrim" id="scrim"></div>

<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="pTitle" inert>
  <header><h2 id="pTitle">Settings</h2><button class="btn icon" id="close" type="button" aria-label="Close settings"><svg class="ic"><use href="#i-x"/></svg></button></header>

  <h3>Theme</h3>
  <div class="swatches" id="themes" role="radiogroup" aria-label="Theme"></div>

  <h3>Glass</h3>
  <label>Blur<input type="range" id="blur" min="0" max="40"></label>
  <label>Card opacity<input type="range" id="alpha" min="0" max="60"></label>
  <label>Background dimming<input type="range" id="dim" min="0" max="80"></label>

  <h3>Background image</h3>
  <input type="text" id="bgUrl" placeholder="assets/background.jpg or https://…" autocomplete="off" spellcheck="false">
  <div class="row gap"><button class="btn pill primary" id="bgApply" type="button">Apply</button><button class="btn pill" id="bgReset" type="button">Use default</button></div>
  <p class="small muted" id="bgNote" role="status"></p>

  <button class="btn pill" id="reset" type="button">Reset all settings</button>
</aside>

<script src="script.js"></script>
</body>
</html>
