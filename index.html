<!DOCTYPE html>
<html lang="zh-Hant" data-theme="purple">
<head>

</svg>

<div class="bg" aria-hidden="true"></div>
<div class="dim" aria-hidden="true"></div>

<button class="enter" id="enter" type="button">
  <b id="enterName"></b>
  <span>Click to Enter</span>
</button>

<main class="page" id="page">
  <header class="top-bar">
    <div class="profile-header">
      <div class="avatar"><img id="avatar" alt="" width="80" height="80"></div>
      <div>
        <h1 id="name"></h1>
        <p class="muted small" id="user"></p>
      </div>
    </div>
    <button class="btn-volume" id="volumeToggle" type="button" aria-label="Toggle music"><svg class="ic"><use href="#i-vol"/></svg></button>
  </header>

  <div class="content-grid">
    <article class="glass-card">
      <h2>設備</h2>
      <div id="devices"></div>
    </article>

    <article class="glass-card">
      <h2>興趣</h2>
      <div id="interests"></div>
    </article>

    <article class="glass-card">
      <h2>最喜歡的動畫</h2>
      <div id="favoriteAnime"></div>
    </article>

    <article class="glass-card">
      <h2>歌手</h2>
      <div id="favoriteArtists"></div>
    </article>
  </div>

  <section class="music-section" id="musicSection">
    <h2 id="musicTitle"></h2>
    <div id="spotifyPlayer"></div>
  </section>
</main>

<button class="fab" id="fab" type="button" aria-label="Open settings" aria-expanded="false" aria-controls="panel"><svg class="ic"><use href="#i-gear"/></svg></button>
<div class="scrim" id="scrim"></div>

<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="pTitle" inert>
  <header><h2 id="pTitle">Settings</h2><button class="btn icon" id="close" type="button" aria-label="Close settings"><svg class="ic"><use href="#i-x"/></svg></button></header>

  <h3>Background Effects</h3>
  <div class="effect-buttons">
    <button class="btn pill" data-effect="none" type="button">None</button>
    <button class="btn pill" data-effect="rain" type="button">Rain</button>
    <button class="btn pill" data-effect="snow" type="button">Snow</button>
    <button class="btn pill" data-effect="crt" type="button">CRT</button>
  </div>

  <button class="btn pill" id="reset" type="button">Reset all settings</button>
</aside>

<script src="script.js"></script>
</body>
</html>
