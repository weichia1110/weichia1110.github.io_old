<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <noscript>
    <style>
      .enter { display: none; }
      .page { opacity: 1 !important; visibility: visible !important; }
    </style>
  </noscript>
</head>
<body class="locked">

  <div class="bg-layer" aria-hidden="true"></div>
  <div id="snow-layer" aria-hidden="true"></div>
  <div id="rain-layer" aria-hidden="true"></div>
  <div id="crt-layer" aria-hidden="true"></div>

  <button class="enter" id="enterBtn" type="button">
    <b id="enterName">My Name</b>
    <span>Click to Enter</span>
  </button>

  <main class="page" id="page">
    <header class="top-bar">
      <div class="profile-header">
        <div class="avatar-wrap">
          <img id="avatar" alt="avatar" src="" />
        </div>
        <h1 id="profileName">My Name</h1>
      </div>

      <button id="musicToggleBtn" class="volume-btn" type="button" aria-label="Music toggle">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M11 5L6 9H3v6h3l5 4V5zM15.54 8.46a5 5 0 0 1 0 7.08M19.07 4.93a10 10 0 0 1 0 14.14" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </header>

    <section class="info-grid">
      <article class="glass-card">
        <h2>設備</h2>
        <div id="devices"></div>
      </article>

      <article class="glass-card">
        <h2>興趣</h2>
        <div id="interests"></div>
      </article>

      <article class="glass-card">
        <h2>最喜歡的動畫</h2>
        <div id="favoriteAnime"></div>
      </article>

      <article class="glass-card">
        <h2>歌手</h2>
        <div id="favoriteArtists"></div>
      </article>
    </section>

    <section class="music-panel" id="musicPanel">
      <div class="music-header">
        <div class="track-meta">
          <div id="musicName" class="music-name">Music Name</div>
          <div id="musicArtist" class="music-artist">Artist</div>
        </div>

        <button id="playPauseBtn" class="play-btn" type="button" aria-label="Play or pause music">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path class="play-path" d="M6 3l14 9-14 9V3z" fill="currentColor"/>
          </svg>
        </button>
      </div>

      <div class="music-controls">
        <span id="currentTime" class="time-text">0:00</span>
        <input id="progressBar" type="range" min="0" max="100" step="0.1" value="0" aria-label="Song progress" />
        <span id="durationTime" class="time-text">0:00</span>
      </div>
    </section>

    <div class="social-badges">
      <a id="discordLink" class="social-badge" href="#" target="_blank" rel="noopener noreferrer" aria-label="Discord">
        <img src="assets/icons/discord.png" alt="Discord" />
      </a>
      <a id="instagramLink" class="social-badge" href="#" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <img src="assets/icons/instagram.png" alt="Instagram" />
      </a>
      <a id="spotifyLink" class="social-badge" href="#" target="_blank" rel="noopener noreferrer" aria-label="Spotify">
        <img src="assets/icons/spotify.png" alt="Spotify" />
      </a>
    </div>
  </main>

  <button class="fab" id="fab" type="button" aria-label="Open settings" aria-expanded="false">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="1" fill="currentColor"/>
      <circle cx="12" cy="5" r="1" fill="currentColor"/>
      <circle cx="12" cy="19" r="1" fill="currentColor"/>
      <circle cx="19" cy="12" r="1" fill="currentColor"/>
      <circle cx="5" cy="12" r="1" fill="currentColor"/>
      <circle cx="16.5" cy="7.5" r="1" fill="currentColor"/>
      <circle cx="7.5" cy="16.5" r="1" fill="currentColor"/>
      <circle cx="7.5" cy="7.5" r="1" fill="currentColor"/>
      <circle cx="16.5" cy="16.5" r="1" fill="currentColor"/>
    </svg>
  </button>

  <div class="scrim" id="scrim"></div>

  <aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" inert>
    <header class="panel-header">
      <h2 id="settingsTitle">Settings</h2>
      <button id="closePanelBtn" class="panel-close" type="button" aria-label="Close settings">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <div class="setting-group">
      <label class="toggle-row">
        <span>Snow</span>
        <input id="effectSnow" type="checkbox" checked />
      </label>

      <label class="toggle-row">
        <span>Rain</span>
        <input id="effectRain" type="checkbox" />
      </label>

      <label class="toggle-row">
        <span>CRT / Old TV</span>
        <input id="effectCrt" type="checkbox" />
      </label>
    </div>
  </aside>

  <audio id="bgMusic" preload="auto" loop></audio>

  <script src="script.js"></script>
</body>
</html>
