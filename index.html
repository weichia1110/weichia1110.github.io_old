<!DOCTYPE html>
<html lang="zh-Hant" data-theme="white">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
<noscript><style>.enter{display:none}</style></noscript>
</head>
<body class="locked">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><polygon fill="currentColor" points="6 3 20 12 6 21 6 3"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect fill="currentColor" x="14" y="4" width="4" height="16" rx="1"/><rect fill="currentColor" x="6" y="4" width="4" height="16" rx="1"/></rect></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="14" y1="20" y2="20"/><line x1="10" x2="3" y1="20" y2="20"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
</svg>

<div class="bg" aria-hidden="true"></div>
<div class="dim" aria-hidden="true"></div>
<div id="snow-container" aria-hidden="true"></div>
<div id="rain-container" aria-hidden="true"></div>
<div id="crt-container" aria-hidden="true"></div>

<button class="enter" id="enter" type="button">
  <b id="enterName"></b>
  <span>Click to Enter</span>
</button>

<main class="page" id="page">
  <header class="top-bar">
    <div class="profile-header">
      <div class="avatar"><img id="avatar" alt="" width="80" height="80"></div>
      <div>
        <h1 id="name"></h1>
      </div>
    </div>
    <button class="btn-volume" id="volumeToggle" type="button" aria-label="Toggle music"><svg class="ic"><use href="#i-vol"/></svg></button>
  </header>

  <div class="content-grid">
    <article class="glass-card">
      <h2>設備</h2>
      <div id="devices"></div>
    </article>

    <article class="glass-card">
      <h2>興趣</h2>
      <div id="interests"></div>
    </article>

    <article class="glass-card">
      <h2>最喜歡的動畫</h2>
      <div id="favoriteAnime"></div>
    </article>

    <article class="glass-card">
      <h2>歌手</h2>
      <div id="favoriteArtists"></div>
    </article>
  </div>

  <section class="music-section" id="musicSection">
    <div class="music-header">
      <div>
        <h2 id="musicName" class="pixel-text"></h2>
        <p id="musicArtist" class="muted pixel-text"></p>
      </div>
      <button class="btn-play" id="musicPlayBtn" type="button" aria-label="Play/Pause"><svg class="ic"><use href="#i-play"/></svg></button>
    </div>
    <div class="music-controls">
      <span class="time pixel-text" id="musicTime">0:00</span>
      <input type="range" id="musicProgress" class="progress-bar" min="0" max="100" value="0">
      <span class="time pixel-text" id="musicDuration">0:00</span>
    </div>
  </section>

  <div class="social-badges">
    <a href="#" class="social-badge" id="discordBadge" title="Discord" rel="noopener noreferrer">
      <img src="assets/icons/discord.png" alt="Discord">
    </a>
    <a href="#" class="social-badge" id="instagramBadge" title="Instagram" rel="noopener noreferrer">
      <img src="assets/icons/instagram.png" alt="Instagram">
    </a>
    <a href="#" class="social-badge" id="spotifyBadge" title="Spotify" rel="noopener noreferrer">
      <img src="assets/icons/spotify.png" alt="Spotify">
    </a>
  </div>
</main>

<button class="fab" id="fab" type="button" aria-label="Open settings" aria-expanded="false" aria-controls="panel"><svg class="ic"><use href="#i-gear"/></svg></button>
<div class="scrim" id="scrim"></div>

<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="pTitle" inert>
  <header><h2 id="pTitle" class="pixel-text">Settings</h2><button class="btn icon" id="close" type="button" aria-label="Close settings"><svg class="ic"><use href="#i-x"/></svg></button></header>

  <h3>Background Effects</h3>
  <div class="effect-buttons">
    <label class="effect-toggle">
      <input type="checkbox" id="effectSnow" data-effect="snow">
      <span class="pixel-text">Snow</span>
    </label>
    <label class="effect-toggle">
      <input type="checkbox" id="effectRain" data-effect="rain">
      <span class="pixel-text">Rain</span>
    </label>
    <label class="effect-toggle">
      <input type="checkbox" id="effectCrt" data-effect="crt">
      <span class="pixel-text">CRT</span>
    </label>
  </div>

  <button class="btn pill" id="reset" type="button" class="pixel-text">Reset Settings</button>
</aside>

<audio id="bgMusic" preload="metadata"></audio>

<script src="script.js"></script>
</body>
</html>
